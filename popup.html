<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Data Fake BR - ALN</title>
		<link rel="stylesheet" href="popup.css">
	</head>

	<body>
		<main class="popup">
			<section class="card">
				<span class="eyebrow">Data Fake BR</span>
				<h1>Preenchimento inteligente</h1>
				<p class="subtitle">
					Detecta labels e campos em portugu&#234;s para agilizar testes de formul&#225;rio.
				</p>

				<div class="field">
					<label for="perfil">Perfil de dados</label>
					<select id="perfil">
						<option value="completo">Completo</option>
						<option value="pessoaFisica">Pessoa F&#237;sica</option>
						<option value="pessoaJuridica">Pessoa Jur&#237;dica</option>
						<option value="pacienteSus">Paciente SUS</option>
					</select>
				</div>

				<div class="field">
					<label for="seed">Seed (opcional, para reproduzir dados)</label>
					<input id="seed" type="text" placeholder="ex.: 12345" autocomplete="off">
				</div>

				<div class="actions">
					<button id="fill" type="button">Preencher formul&#225;rio</button>
					<button id="export" type="button" class="secondary" disabled>Exportar relat&#243;rio</button>
				</div>

				<p id="status" class="status" data-variant="idle">
					Pronto para preencher campos reconhecidos na p&#225;gina atual.
				</p>

				<p class="footnote">
					Compat&#237;vel com campos nativos e alguns componentes customizados.
				</p>

				<p class="footnote">
					<a href="#" id="linkDemo">Baixar p&#225;gina de demonstra&#231;&#227;o</a>
				</p>
			</section>
		</main>

		<script src="popup.js"></script>

	</body>
</html>
